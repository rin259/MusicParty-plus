<!doctype html>
<html lang="zh-CN">
  <head>
    <script>
      // Synchronous pre-paint restore; the shared runtime validates/rebuilds it before mounting.
      (() => {
        try {
          const root = document.documentElement;
          const raw = localStorage.getItem('mp_appearance_v1');
          const pref = raw ? JSON.parse(raw) : {};
          const requested = pref.mode || localStorage.getItem('mp_theme');
          const mode = requested === 'light' || requested === 'dark' ? requested
            : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          root.classList.toggle('dark', mode === 'dark');
          root.dataset.theme = mode;
          root.style.colorScheme = mode;
          const cached = JSON.parse(localStorage.getItem('mp_appearance_boot_v1') || 'null');
          if (cached && cached.preference === raw) {
            for (const [key, rgb] of Object.entries(cached[mode] || {})) {
              if (/^(medical-(50|[1-9]00)|surface-(1|2|strong)|accent(-hover|-fg|-text|-glow|-on-strong)?|ink(-fg)?|scrim|(danger|success|warn)(-fg|-bg|-border)?)$/.test(key)
                && Array.isArray(rgb) && rgb.length === 3 && rgb.every(c => Number.isInteger(c) && c >= 0 && c <= 255)) {
                root.style.setProperty('--' + key, rgb.join(' '));
              }
            }
          }
        } catch { /* Restricted/corrupt storage falls back to the CSS defaults. */ }
      })();
    </script>
    <script type="module" src="/src/themeBootstrap.js"></script>
    <meta charset="UTF-8" />
    <meta name="referrer" content="no-referrer" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-visual" />
    <meta name="description" content="Music Party — 和朋友在同一个房间里实时听歌、点歌、聊天。" />
    <meta name="theme-color" content="#f9fafb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0e1116" media="(prefers-color-scheme: dark)" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Noto+Sans+SC:wght@400;700&display=swap" rel="stylesheet">
    <title>MUSIC PARTY</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
