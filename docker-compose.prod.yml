name: musicparty

services:
  netease-api:
    image: moefurina/ncm-api:latest
    container_name: music-party-netease
    restart: unless-stopped
    environment:
      PORT: "3000"
      HTTPS: "true"
    networks:
      - music-net

  music-party:
    image: music-party:stable-local
    build:
      context: .
      dockerfile: Dockerfile
    container_name: music-party-app
    restart: unless-stopped
    depends_on:
      netease-api:
        condition: service_started
    env_file:
      - .env.production
    environment:
      NETEASE_API_URL: http://netease-api:3000
      BASE_URL: https://ajdgsu.online:50820
      APP_AUTHOR_NAME: MusicParty
      APP_BACK_WORDS: MUSIC PARTY
      NETEASE_ENABLED: "true"
      BILIBILI_ENABLED: "true"
      NETEASE_QUALITY: exhigh
      QUEUE_MAX_SIZE: "1000"
      QUEUE_HISTORY_SIZE: "50"
      QUEUE_MAX_USER_SONGS: "100"
      PLAYLIST_IMPORT_LIMIT: "100"
      CHAT_HISTORY_LIMIT: "1000"
      CHAT_MIN_INTERVAL: "1000"
      CHAT_MAX_LENGTH: "200"
      CACHE_MAX_SIZE: 1GB
      YT_DLP_ENABLED: "true"
      YT_DLP_PATH: yt-dlp
      YT_DLP_TIMEOUT_SECONDS: "60"
      YT_DLP_DOWNLOAD_TIMEOUT_SECONDS: "900"
      AUTH_RATE_LIMIT_ENABLED: "true"
      AUTH_MAX_ATTEMPTS: "5"
      AUTH_WINDOW_SECONDS: "60"
      AUTH_BLOCK_DURATION: "300"
    ports:
      - "127.0.0.1:18720:8080"
    volumes:
      - ./music_party/cached_media:/app/cached_media
      - ./music_party/data:/app/data
    networks:
      - music-net

networks:
  music-net:
    driver: bridge
