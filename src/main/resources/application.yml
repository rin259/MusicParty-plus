server:
  port: 8080

spring:
  mvc:
    # Search fan-out to yt-dlp can be slow on a cold cache; give async requests
    # room instead of failing with AsyncRequestTimeoutException at 30s.
    async:
      request-timeout: 90s

# Logging configuration
logging:
  level:
    # Set the root logger to INFO
    root: INFO
    # Set our application's package to DEBUG for more detailed logs during development
    com.example.musicparty: DEBUG

# Custom application properties
app:
  music-api:
    admin-password: ${ADMIN_PASSWORD:admin123}
    base-url: ${BASE_URL:http://localhost:8080}
    author-name: ${APP_AUTHOR_NAME:ThorNex}
    back-words: ${APP_BACK_WORDS:THORNEX}
    netease:
      # The base URL of your deployed NeteaseCloudMusicApi instance
      base-url: ${NETEASE_API_URL:http://netease-api:3000}
      cookie: ${NETEASE_COOKIE:}
      quality: ${NETEASE_QUALITY:exhigh}
      enabled: ${NETEASE_ENABLED:true}
    bilibili:
      # Bilibili API base URL, it's public
      base-url: "https://api.bilibili.com"
      sessdata: ${BILIBILI_SESSDATA:}
      enabled: ${BILIBILI_ENABLED:true}
    soundcloud:
      enabled: ${SOUNDCLOUD_ENABLED:true}
      search-limit: ${SOUNDCLOUD_SEARCH_LIMIT:30}
      fetch-limit: ${SOUNDCLOUD_FETCH_LIMIT:100}
    soundcloud-oauth:
      client-id: ${SOUNDCLOUD_CLIENT_ID:}
      client-secret: ${SOUNDCLOUD_CLIENT_SECRET:}
      redirect-uri: ${SOUNDCLOUD_REDIRECT_URI:}
      api-base: ${SOUNDCLOUD_API_BASE:https://api.soundcloud.com}
    ytmusic:
      enabled: ${YTMUSIC_ENABLED:true}
      search-limit: ${YTMUSIC_SEARCH_LIMIT:30}
      fetch-limit: ${YTMUSIC_FETCH_LIMIT:100}
    queue:
      max-size: ${QUEUE_MAX_SIZE:1000}
      history-size: ${QUEUE_HISTORY_SIZE:50}
      max-user-songs: ${QUEUE_MAX_USER_SONGS:100}
    player:
      max-playlist-import-size: ${PLAYLIST_IMPORT_LIMIT:100}
    chat:
      max-history-size: ${CHAT_HISTORY_LIMIT:1000}
      min-interval-ms: ${CHAT_MIN_INTERVAL:1000}
      max-message-length: ${CHAT_MAX_LENGTH:200}
    cache:
      max-size: ${CACHE_MAX_SIZE:1GB}
    yt-dlp:
      enabled: ${YT_DLP_ENABLED:true}
      path: ${YT_DLP_PATH:yt-dlp}
      timeout-seconds: ${YT_DLP_TIMEOUT_SECONDS:45}
      # 单曲下载上限：原 900s 会让一首卡死的曲目堵住串行队列达 15 分钟
      download-timeout-seconds: ${YT_DLP_DOWNLOAD_TIMEOUT_SECONDS:180}
      # SoundCloud 是 HLS 分片流；4 路并发单曲 ~8s 且批量稳定（8 路虽更快但会被 CDN 限流）
      download-concurrency: ${YT_DLP_DOWNLOAD_CONCURRENCY:4}
      # yt-dlp 源（SoundCloud / YTMusic）下载任务之间的冷却（毫秒）；直链源固定 3s
      download-cooldown-ms: ${YT_DLP_DOWNLOAD_COOLDOWN_MS:1000}
    auth:
      rate-limit:
        enabled: ${AUTH_RATE_LIMIT_ENABLED:true}
        max-attempts: ${AUTH_MAX_ATTEMPTS:5}
        window-seconds: ${AUTH_WINDOW_SECONDS:60}
        block-duration-seconds: ${AUTH_BLOCK_DURATION:300}
